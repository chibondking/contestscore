# /etc/nginx/sites-available/scoreboard.wt2p.us
#
# SSL is handled by Cloudflare (cloudflared tunnel), not by this box directly
# -- no certbot needed here. This nginx block only needs to serve plain HTTP
# on localhost; the tunnel's Public Hostname entry (in
# /etc/cloudflared/config.yml) is what maps scoreboard.wt2p.us -> this.
# See deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name scoreboard.wt2p.us;

    # DB reset is destructive and must stay off the public internet.
    # Cloudflare Tunnel traffic always arrives here as 127.0.0.1 (from the
    # cloudflared process on this same box), so it is deliberately NOT in
    # this allow-list -- only a direct request over Tailscale or ZeroTier
    # can reach this route at all. The app also requires a bearer token
    # (CONTESTSCORE_API_TOKEN) on top of this as a second layer.
    location = /api/db {
        allow 100.64.0.0/10;    # Tailscale CGNAT range
        allow 192.168.7.0/24;   # ZeroTier "WT2P" network
        allow 192.168.1.0/24;   # ZeroTier "NW8S NETWORK"
        deny all;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Crucial headers for Socket.IO / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/score, /api/qsos, /api/radios are polled by the dashboard --
        # make sure nginx (or any CDN/cache in front of it later) never
        # caches them, or viewers see stale data.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
