# /etc/nginx/sites-available/scoreboard.wt2p.us
#
# SSL is handled by Cloudflare (cloudflared tunnel), not by this box directly
# -- no certbot needed here. This nginx block only needs to serve plain HTTP
# on localhost; the tunnel's Public Hostname entry (in
# /etc/cloudflared/config.yml) is what maps scoreboard.wt2p.us -> this.
# See deploy/DEPLOY.md.

server {
    listen 80;
    listen [::]:80;
    server_name scoreboard.wt2p.us;

    # DB reset (/api/db) and the admin page are deliberately NOT IP-restricted
    # here -- Cloudflare Tunnel traffic always arrives at nginx as 127.0.0.1,
    # so an IP allow-list can't recognize "the admin's own device" when they
    # load the public hostname regardless of what network that device is
    # actually on. Protection is the bearer token (CONTESTSCORE_API_TOKEN)
    # alone -- a 64-char random secret, same model already used for
    # /api/ingest/*. See deploy/DEPLOY.md and public/admin.html.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Crucial headers for Socket.IO / WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/score, /api/qsos, /api/radios are polled by the dashboard --
        # make sure nginx (or any CDN/cache in front of it later) never
        # caches them, or viewers see stale data.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }
}
