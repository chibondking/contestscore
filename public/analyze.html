<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Applied before first paint so a viewer who chose light never sees a
       dark flash -- dark is the default (no localStorage entry) and needs
       no attribute at all. See chrome.js for the toggle that sets/persists
       this key. -->
  <script>
    try {
      if (localStorage.getItem('contestpulse_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch {}
  </script>
  <title>ContestPulse Analyze</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="analyze()" x-init="init()">

  <header class="header" data-page="analyze"></header>

  <main class="grid">

    <!-- Upload form (path is /analyze) -->
    <template x-if="mode === 'upload'">
      <section class="card card--wide">
        <h2>Analyze a contest log</h2>
        <p class="empty" style="margin-bottom:1rem; max-width:60ch">
          Upload a submitted Cabrillo (<code>.cbr</code> / <code>.log</code>) or an
          ADIF export (<code>.adi</code>), or type the QSOs straight in. It is
          parsed, saved, and given a shareable link, then rendered through the
          same Stats and Charts breakdowns as the live dashboard. An ADIF
          export from N1MM carries points, multipliers, per-operator and
          run/S&amp;P data; a Cabrillo or manual entry does not, so those
          sections are hidden. Continent, DXCC and CQ-zone breakdowns work
          for all three (resolved from each worked call).
        </p>

        <label class="analyze-field">
          Admin token
          <input type="password" x-model="token" @input="saveToken()" @change="loadSaved()"
            placeholder="CONTESTSCORE_API_TOKEN" autocomplete="off" spellcheck="false">
        </label>

        <div class="analyze-actions" style="margin-bottom:1rem">
          <button class="btn" :class="entryMode === 'file' ? '' : 'btn--ghost'" @click="entryMode = 'file'">Upload file</button>
          <button class="btn" :class="entryMode === 'manual' ? '' : 'btn--ghost'" @click="entryMode = 'manual'">Enter manually</button>
          <button class="btn" :class="entryMode === 'live' ? '' : 'btn--ghost'" @click="entryMode = 'live'">Live contest</button>
        </div>

        <div x-show="entryMode === 'live'">
          <p class="empty" style="max-width:60ch;margin-bottom:1rem">
            Snapshot the contest running on the dashboard right now — the full
            N1MM feed straight from the <code>qsos</code> table, so points,
            multipliers, per-operator and run/S&amp;P are all included with
            nothing to export or type.
            <span x-show="liveCount !== null"
              x-text="'Currently ' + Number(liveCount).toLocaleString() + (liveCount === 1 ? ' QSO.' : ' QSOs.')"></span>
          </p>
          <button class="btn" @click="analyzeLive()"
            :disabled="!token || !liveCount || busy"
            x-text="busy ? 'Snapshotting…' : 'Snapshot the live contest'"></button>
        </div>

        <div x-show="entryMode === 'file'">
          <div class="drop" @dragover.prevent @drop="onDrop($event)"
            :class="fileName ? 'drop--set' : ''">
            <input type="file" id="logfile" class="drop__input"
              accept=".cbr,.log,.txt,.adi,.adif,text/plain" @change="pickFile($event)">
            <label for="logfile" class="drop__label"
              x-text="fileName || 'Choose a file, or drop it here'"></label>
          </div>
          <button class="btn" @click="upload()" :disabled="!file || !token || busy"
            x-text="busy ? 'Analyzing…' : 'Analyze &amp; save'"></button>
        </div>

        <div x-show="entryMode === 'manual'">
          <datalist id="contestkeys">
            <option>CWT</option><option>K1USN-SST</option><option>MST</option>
            <option>CQ-WW-CW</option><option>CQ-WW-SSB</option>
            <option>CQ-WPX-CW</option><option>CQ-WPX-SSB</option><option>CQ-160-CW</option>
            <option>ARRL-DX-CW</option><option>ARRL-DX-SSB</option><option>ARRL-160</option>
            <option>ARRL-SS-CW</option><option>ARRL-SS-SSB</option><option>ARRL-FIELD-DAY</option>
            <option>NAQP-CW</option><option>NAQP-SSB</option><option>NA-SPRINT-CW</option>
            <option>IARU-HF</option><option>STEW-PERRY</option><option>WAE-CW</option>
          </datalist>
          <div class="man-grid">
            <label>Contest
              <input list="contestkeys" x-model="man.contest" placeholder="CWT">
            </label>
            <label>My callsign
              <input x-model="man.mycall" placeholder="K3LR" spellcheck="false">
            </label>
            <label>My sent exchange
              <input x-model="man.myexch" placeholder="599  ·  TIM PA  ·  3A EPA" spellcheck="false">
            </label>
            <label>Default band
              <select x-model="man.band">
                <option>160m</option><option>80m</option><option>40m</option>
                <option>30m</option><option>20m</option><option>17m</option>
                <option>15m</option><option>12m</option><option>10m</option>
                <option>6m</option><option>2m</option>
              </select>
            </label>
            <label>Default mode
              <select x-model="man.mode">
                <option>CW</option><option>SSB</option><option>RTTY</option><option>FT8</option>
              </select>
            </label>
            <label>Date (UTC)
              <input type="date" x-model="man.date">
            </label>
          </div>

          <label class="analyze-field" style="margin-top:1rem">
            QSOs — one per line: <code>[HHMM] [band] CALL [their exchange…]</code>
            <textarea x-model="man.qsos" rows="10" spellcheck="false"
              placeholder="W1AW BOB CT&#10;1307 K5ZD RANDY MA&#10;40m DL1XYZ HANS DL&#10;&#10;# or paste raw QSO: / ADIF lines, they pass straight through"></textarea>
          </label>
          <p class="empty" x-text="manCount + (manCount === 1 ? ' QSO' : ' QSOs') + ' recognised'"></p>
          <button class="btn" @click="analyzeManual()"
            :disabled="!man.mycall || !manCount || !token || busy"
            x-text="busy ? 'Analyzing…' : 'Analyze &amp; save'"></button>
        </div>

        <p x-show="error" class="analyze-error" x-text="error"></p>

        <hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">
        <h2 style="margin-bottom:.5rem">Compare two saved analyses</h2>
        <div class="analyze-actions" style="align-items:center">
          <input type="text" x-model="cmpA" placeholder="analysis A — id or URL"
            style="flex:1;min-width:14rem;padding:.5rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:inherit">
          <input type="text" x-model="cmpB" placeholder="analysis B — id or URL"
            style="flex:1;min-width:14rem;padding:.5rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:inherit">
          <button class="btn btn--ghost" @click="goCompare2()" :disabled="!cmpA || !cmpB">Compare</button>
        </div>

        <template x-if="token">
          <div>
            <hr style="border:none;border-top:1px solid var(--border);margin:1.5rem 0">
            <div style="display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap">
              <h2 style="margin:0">Saved analyses</h2>
              <button class="btn btn--ghost" style="padding:.1em .55em;font-size:.78rem"
                @click="loadSaved()" x-text="savedLoading ? '…' : 'refresh'"></button>
              <span class="empty" x-show="savedRetention"
                x-text="'keeping newest ' + savedRetention.keep + ', ≤ ' + savedRetention.ttl_days + ' days'"></span>
            </div>
            <p class="analyze-error" x-show="savedError" x-text="savedError"></p>
            <p class="empty" x-show="!savedLoading && !savedError && !savedLogs.length">No saved analyses yet.</p>
            <div class="table-scroll" x-show="savedLogs.length">
              <table class="qso-table stats-table">
                <thead><tr>
                  <th>Contest</th><th>Call</th><th class="num">QSOs</th>
                  <th>Format</th><th>Saved (UTC)</th><th></th>
                </tr></thead>
                <tbody>
                  <template x-for="s in savedLogs" :key="s.id">
                    <tr>
                      <td x-text="s.contest || '—'"></td>
                      <td x-text="s.station_call || '—'"></td>
                      <td class="num" x-text="Number(s.qso_count).toLocaleString()"></td>
                      <td x-text="(s.format || '').toUpperCase()"></td>
                      <td x-text="(s.created_at || '').replace('T', ' ').slice(0, 16) + (ageOut(s.created_at) ? '  ·  ' + ageOut(s.created_at) : '')"></td>
                      <td style="white-space:nowrap">
                        <a class="btn btn--ghost" style="padding:.1em .55em;font-size:.78rem" :href="'/analyze/' + s.id">open</a>
                        <button class="btn btn--ghost" style="padding:.1em .55em;font-size:.78rem;border-color:var(--red);color:var(--red)" @click="deleteSaved(s.id)">delete</button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- Unknown / expired id -->
    <template x-if="mode === 'notfound'">
      <section class="card card--wide">
        <h2>Analysis not found</h2>
        <p class="empty">
          This link is unknown, or the analysis has aged out of retention.
          <a href="/analyze">Upload a log</a>.
        </p>
      </section>
    </template>

    <!-- Result landing (path is /analyze/&lt;id&gt;) -->
    <template x-if="mode === 'result' && meta">
      <section class="card card--wide">
        <h2 x-text="(meta.contest || 'Uploaded log') + (meta.station_call ? ' — ' + meta.station_call : '')"></h2>

        <div class="tile-row">
          <div class="metric">
            <span class="metric__value" x-text="Number(meta.qso_count).toLocaleString()"></span>
            <span class="metric__label">QSOs</span>
          </div>
          <div class="metric">
            <span class="metric__value" x-text="meta.format.toUpperCase()"></span>
            <span class="metric__label">Format</span>
          </div>
          <div class="metric">
            <span class="metric__value" x-text="meta.operators ? meta.operators.trim().split(/\s+/).length : '—'"></span>
            <span class="metric__label">Operators</span>
          </div>
          <div class="metric">
            <span class="metric__value" x-text="meta.claimed_score != null ? Number(meta.claimed_score).toLocaleString() : '—'"></span>
            <span class="metric__label">Claimed score</span>
          </div>
        </div>

        <p class="empty" style="margin-top:1rem" x-show="!meta.has_points && !meta.has_operator">
          Cabrillo log — no points, multiplier, per-operator or run/S&amp;P data in
          this format. Band / mode / rate / time / continent / DXCC / zone
          breakdowns are shown; the rest are hidden.
        </p>

        <p class="empty" style="margin-top:0.5rem" x-show="meta.format === 'cabrillo'"
          x-text="meta.contest_key
            ? (meta.exchange_parsed
                ? meta.contest_key + ' — exchange parsed from the log (sections / zones / serials read directly)'
                : meta.contest_key + ' — exchange format not recognised for this log; worked calls and geography still resolved')
            : (meta.contest ? meta.contest + ' — unknown contest; best-effort worked-call parsing' : 'No CONTEST header; best-effort worked-call parsing')"></p>

        <p class="empty" style="margin-top:0.5rem" x-show="meta.excluded_count > 0">
          <span x-text="meta.excluded_count + ' removed QSO' + (meta.excluded_count === 1 ? '' : 's') + ' (X-QSO) — excluded from every count'"></span>
          <button class="btn btn--ghost" style="margin-left:.5rem;padding:.1em .55em;font-size:.78rem"
            @click="showExcluded = !showExcluded" x-text="showExcluded ? 'hide' : 'show'"></button>
        </p>
        <div class="chips" style="margin-top:.35rem" x-show="showExcluded && excluded.length">
          <template x-for="(x, i) in excluded" :key="i">
            <span class="chip"><b x-text="x.call || '?'"></b> <span x-text="x.band + ' ' + x.mode"></span></span>
          </template>
        </div>

        <div class="analyze-actions">
          <a class="btn" :href="'/stats.html?log=' + logId">Open Stats</a>
          <a class="btn" :href="'/charts.html?log=' + logId">Open Charts</a>
          <button class="btn btn--ghost" @click="copyShare()"
            x-text="copied ? 'Copied!' : 'Copy share link'"></button>
          <button class="btn btn--ghost" @click="copySummary()"
            x-text="summaryState === 'copied' ? 'Copied!'
              : summaryState === 'failed' ? 'Copy failed — try again'
              : 'Copy summary (email)'"></button>
          <button class="btn btn--ghost" @click="downloadReport()">Download report</button>
        </div>

        <div class="analyze-actions" style="align-items:center">
          <input type="text" x-model="compareId" @keydown.enter="goCompare()"
            placeholder="another analysis id or /analyze/… URL"
            style="flex:1;min-width:16rem;padding:.5rem;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-family:inherit">
          <button class="btn btn--ghost" @click="goCompare()" :disabled="!compareId">Compare</button>
        </div>

        <p class="empty" style="margin-top:0.75rem"
          x-text="'File: ' + (meta.filename || '—') + '  ·  uploaded ' + (meta.created_at || '')"></p>
      </section>
    </template>

  </main>

  <footer class="footer"></footer>

  <script src="/js/chrome.js"></script>
  <script src="/js/report.js"></script>
  <script src="/js/manual.js"></script>
  <script src="/js/analyze.js"></script>
</body>
</html>
