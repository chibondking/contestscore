<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContestPulse</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <!-- Plain (non-deferred), same reasoning as dashboard.js not being
       type="module": io/Chart must exist as globals before Alpine's
       deferred script initializes and starts evaluating x-effect
       expressions that call into them. The continent breakdown stays plain
       CSS/HTML (see world-map styles) -- Chart.js is only for the Score/
       Rate cards' small sparklines. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="dashboard()" x-init="init()">

  <header class="header" data-page="dashboard">
    <span class="grid-locator" x-show="score.grid6" x-text="score.grid6"></span>
    <!-- Feed Status used to be its own card; a deployment only ever has one
         bridge feeding it, so a full card was more real estate than the
         information warranted. It lives here now, next to the connection
         badge it's conceptually similar to (both are "is data getting to
         this page" signals), freeing that grid slot for Score/Rate to grow
         into (see .card--large below). -->
    <template x-for="b in bridges" :key="b.station_id">
      <span class="bridge-badge" :class="'bridge-badge--' + b.status" x-text="b.station_id + ': ' + b.status"></span>
    </template>
    <span class="updated" x-text="'updated ' + secondsSinceUpdate() + 's ago'"></span>
    <span class="status" :class="connected ? 'status--ok' : 'status--err'">
      <span x-text="connected ? 'live' : 'disconnected'"></span>
    </span>
  </header>

  <main class="grid">

    <section class="card card--large" id="score">
      <h2>Score</h2>
      <div class="score-row">
        <div class="metric">
          <span class="metric__value" x-text="score.qsos ?? '—'"></span>
          <span class="metric__label">QSOs</span>
        </div>
        <div class="metric">
          <span class="metric__value" x-text="score.mults ?? '—'"></span>
          <span class="metric__label">Mults</span>
        </div>
        <div class="metric">
          <span class="metric__value" x-text="score.total ?? '—'"></span>
          <span class="metric__label">Total</span>
        </div>
      </div>
      <div class="sparkline">
        <canvas id="scoreSparkline" x-effect="renderScoreSparkline()"></canvas>
      </div>
    </section>

    <section class="card card--large" id="rate">
      <h2>Rate</h2>
      <div class="score-row" x-show="rate.length > 0">
        <template x-for="r in rate" :key="r.minutes">
          <div class="metric">
            <span class="metric__value" x-text="r.rate_per_hour ?? '—'"></span>
            <span class="metric__label" x-text="(r.minutes ?? '?') + ' min'"></span>
          </div>
        </template>
      </div>
      <p x-show="rate.length === 0" class="empty">Loading…</p>
      <div class="sparkline">
        <canvas id="rateSparkline" x-effect="renderRateSparkline()"></canvas>
      </div>
    </section>

    <section class="card card--compact" id="radios">
      <h2>Radios</h2>
      <!-- Band only, never the exact frequency -- for some contests,
           broadcasting the running frequency to anyone with the dashboard
           URL amounts to cheerleading/spotting your own run. r.band is
           computed server-side (src/parsers/util.js's freqToBand()); the
           exact freq/tx_freq are stripped before this ever reaches the
           browser, not just hidden here -- see the API/socket layer's own
           comments for why UI-only hiding wasn't enough. -->
      <template x-for="r in radios" :key="(r.station_name || '') + ':' + r.radio_nr">
        <div class="radio-row">
          <span class="radio-nr" x-text="radioLabel(r)"></span>
          <span class="radio-freq" x-text="r.band || '—'"></span>
          <span class="radio-mode" x-text="r.mode || '—'"></span>
          <!-- N1MM reports IsTransmitting independent of IsRunning (a S&P
               radio transmits too, briefly, calling a station) -- red while
               actually keying the transmitter, green at every other moment
               (listening), so a multi-multi's whole radio list reads at a
               glance without needing the band/mode text. -->
          <span class="tx-dot" :class="r.is_transmitting ? 'tx-dot--tx' : 'tx-dot--rx'" :title="r.is_transmitting ? 'Transmitting' : 'Receiving'"></span>
          <span class="radio-op" x-text="r.op_call || '—'"></span>
          <span class="radio-run" x-show="r.is_running">RUN</span>
        </div>
      </template>
      <p x-show="radios.length === 0" class="empty">No radio data yet</p>
    </section>

    <section class="card card--wide" id="operators" x-show="qsos.length > 0">
      <h2>Operators</h2>
      <table class="qso-table">
        <thead>
          <tr>
            <th>Operator</th><th>QSOs</th><th>Points</th><th>Peak Rate (60m)</th><th>Peak Rate (10m)</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="op in operatorStats()" :key="op.operator">
            <tr>
              <td x-text="op.operator"></td>
              <td x-text="op.qsos"></td>
              <td x-text="op.points"></td>
              <td x-text="op.peakRate60 + '/hr'"></td>
              <td x-text="op.peakRate10 + '/hr'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>

    <section class="card card--wide" id="log">
      <h2>Recent QSOs</h2>
      <div class="log-layout">
        <div class="log-table-wrap">
          <table class="qso-table">
            <thead>
              <tr>
                <th>Call</th><th>Band</th><th>Mode</th><th>Operator</th><th>Pts</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="q in qsos.slice(0, 20)" :key="q.ext_id ?? q.id ?? (q.call + q.band + q.mode)">
                <tr>
                  <td x-text="q.call"></td>
                  <td x-text="q.band"></td>
                  <td x-text="q.mode"></td>
                  <td x-text="q.operator"></td>
                  <td x-text="q.points"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
        </div>

        <div class="continent-panel" x-show="qsos.length > 0">
          <h3>By Continent</h3>
          <!-- Same sequential blue-alpha scheme as before (see dashboard.js's
               continentCounts()/continentTileStyle()), just as plain rows
               instead of a geographic grid -- the grid's layout never read
               as an actual map, just an awkward crossword-shaped grid. -->
          <template x-for="code in ['NA','EU','AS','AF','OC','SA','AN']" :key="code">
            <div class="continent-row" :style="continentTileStyle(code)">
              <span class="continent-row__label" x-text="code"></span>
              <span class="continent-row__count" x-text="continentCounts()[code] || 0"></span>
            </div>
          </template>
        </div>
      </div>
    </section>

  </main>

  <footer class="footer">
    <span x-show="version.deployedAt" x-text="'deployed ' + formatDeployTime(version.deployedAt) + (version.commit ? ' (' + version.commit + ')' : '')"></span>
  </footer>

  <!-- Not type="module": dashboard() must land on the global scope for
       Alpine's x-data="dashboard()" (evaluated in global scope) to find it.
       A module's top-level declarations are scoped to the module itself,
       not exposed on window -- with type="module" here, Alpine's root
       x-data throws "dashboard is not defined" and the whole component
       silently fails to initialize, which is consistent with every
       "field renders as undefined" symptom seen on this dashboard so far. -->
  <script src="/js/chrome.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
