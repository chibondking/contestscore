<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Applied before first paint so a viewer who chose light never sees a
       dark flash -- dark is the default (no localStorage entry) and needs
       no attribute at all. See chrome.js for the toggle that sets/persists
       this key. -->
  <script>
    try {
      if (localStorage.getItem('contestpulse_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch {}
  </script>
  <title>ContestPulse</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <!-- Plain (non-deferred), same reasoning as dashboard.js not being
       type="module": io/Chart must exist as globals before Alpine's
       deferred script initializes and starts evaluating x-effect
       expressions that call into them. The continent breakdown stays plain
       CSS/HTML (see world-map styles) -- Chart.js is only for the Score/
       Rate cards' small sparklines. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="dashboard()" x-init="init()">

  <header class="header" data-page="dashboard">
    <!-- Contesting runs on UTC, not local time -- the operator's own wall
         clock is the wrong reference for exchange timestamps/log review. -->
    <span class="utc-clock" x-text="utcClock()" title="UTC"></span>
    <!-- The station's transmitted call (N1MM's mycall), not the operator's:
         see stationCall() in dashboard.js. -->
    <span class="station-call" x-show="stationCall()" x-text="stationCall()" title="Transmitted call"></span>
    <span class="contest-name" x-show="score.contest" x-text="score.contest"></span>
    <span class="grid-locator" x-show="score.grid6" x-text="score.grid6"></span>
    <!-- Space weather (SFI / A / K). Populated from GET /api/solar +
         solar:update; hidden until the first reading lands (or entirely if
         SOLAR_ENABLED=false, since /api/solar then stays { updated:null }). -->
    <span class="solar-chip" x-show="solar.updated" :title="solarTooltip()">
      <span x-text="'SFI ' + (solar.sfi ?? '—')"></span>
      <span x-text="'A ' + (solar.a ?? '—')"></span>
      <span x-text="'K ' + (solar.k ?? '—')"></span>
    </span>
    <!-- Feed Status used to be its own card; a deployment only ever has one
         bridge feeding it, so a full card was more real estate than the
         information warranted. It lives here now, next to the connection
         badge it's conceptually similar to (both are "is data getting to
         this page" signals), freeing that grid slot for Score/Rate to grow
         into (see .card--large below). -->
    <template x-for="b in bridges" :key="b.station_id">
      <span class="bridge-badge" :class="'bridge-badge--' + b.status" x-text="b.station_id + ': ' + b.status"></span>
    </template>
    <span class="updated" x-text="'updated ' + secondsSinceUpdate() + 's ago'"></span>
    <span class="status" :class="connected ? 'status--ok' : 'status--err'">
      <span x-text="connected ? 'live' : 'disconnected'"></span>
    </span>
  </header>

  <main class="grid">

    <!-- Its own flex row (.top-row, dashboard.css), not 3 more items in the
         grid above -- see that rule's comment for why: a fixed-track
         approach only keeps all three on one row at widths that happen to
         divide evenly, and drops Radios to its own row (often next to
         unclaimed empty space) at others. -->
    <div class="top-row">

      <section class="card card--large" id="score">
        <h2>
          Score
          <!-- N1MM's Score broadcast is a periodic snapshot, not fired per
               QSO -- it can fall behind the live QSO log during a rush (or
               stop landing for a stretch). Flag the gap instead of quietly
               showing a total that's already out of date; clears itself the
               moment a new broadcast's qsos count catches back up. -->
          <span class="bridge-badge bridge-badge--stale score-stale-badge" x-show="scoreStale()" title="The score snapshot hasn't caught up to the live QSO log yet">catching up</span>
          <!-- DXLog's Score broadcast rides its online-scoreboard timer, so
               this card lags the live log by design -- say so, with the
               measured interval, instead of "catching up". QSOs, rate and
               the map stay realtime. -->
          <span class="score-source-badge" x-show="scoreIsDelayed()" x-text="scoreSourceChip()"
                title="DXLog sends its score on its online-scoreboard timer, not after every QSO, so this card updates on that interval. QSOs, rate and the map are realtime."></span>
        </h2>
        <div class="score-row" :class="{ 'score-row--stale': scoreStale() }">
          <div class="metric">
            <span class="metric__value" x-text="score.qsos ?? '—'"></span>
            <span class="metric__label">QSOs</span>
          </div>
          <div class="metric">
            <span class="metric__value" x-text="score.mults ?? '—'"></span>
            <span class="metric__label">Mults</span>
          </div>
          <div class="metric">
            <span class="metric__value" x-text="score.total ?? '—'"></span>
            <span class="metric__label">Total</span>
          </div>
        </div>
        <div class="sparkline">
          <canvas id="scoreSparkline" x-effect="renderScoreSparkline()"></canvas>
        </div>
      </section>

      <section class="card card--large" id="rate">
        <h2>Rate</h2>
        <div class="score-row" x-show="rate.length > 0">
          <template x-for="r in rate" :key="r.minutes">
            <div class="metric">
              <span class="metric__value" x-text="r.rate_per_hour ?? '—'"></span>
              <span class="metric__label" x-text="(r.minutes ?? '?') + ' min'"></span>
            </div>
          </template>
        </div>
        <p x-show="rate.length === 0" class="empty">Loading…</p>
        <div class="sparkline">
          <canvas id="rateSparkline" x-effect="renderRateSparkline()"></canvas>
        </div>
      </section>

      <section class="card card--compact" id="radios">
        <h2>Radios</h2>
        <!-- Band only, never the exact frequency -- for some contests,
             broadcasting the running frequency to anyone with the dashboard
             URL amounts to cheerleading/spotting your own run. r.band is
             computed server-side (src/parsers/util.js's freqToBand()); the
             exact freq/tx_freq are stripped before this ever reaches the
             browser, not just hidden here -- see the API/socket layer's own
             comments for why UI-only hiding wasn't enough. -->
        <template x-for="r in radios" :key="(r.station_name || '') + ':' + r.radio_nr">
          <div class="radio-row">
            <span class="radio-nr" :title="radioLabel(r)" x-text="radioLabel(r)"></span>
            <span class="radio-freq" x-text="r.band || '—'"></span>
            <span class="radio-mode" x-text="r.mode || '—'"></span>
            <!-- N1MM reports IsTransmitting independent of IsRunning (a S&P
                 radio transmits too, briefly, calling a station) -- red
                 while actually keying the transmitter, green at every other
                 moment (listening), so a multi-multi's whole radio list
                 reads at a glance without needing the band/mode text. -->
            <span class="tx-dot" :class="r.is_transmitting ? 'tx-dot--tx' : 'tx-dot--rx'" :title="r.is_transmitting ? 'Transmitting' : 'Receiving'"></span>
            <span class="radio-op" x-text="r.op_call || '—'"></span>
            <span class="radio-run" x-show="r.is_running">RUN</span>
            <!-- N1MM's FunctionKeyCaption: the label of the F-key that
                 started the current transmission (e.g. "F1: CQ"). Only
                 meaningful while actually keying -- N1MM doesn't clear it
                 back out between transmissions, so showing it once
                 is_transmitting goes false would display a stale message
                 as if it were still going out. -->
            <span class="radio-msg" x-show="r.is_transmitting && r.function_key_caption" x-text="r.function_key_caption"></span>
          </div>
        </template>
        <p x-show="radios.length === 0" class="empty">No radio data yet</p>
      </section>

    </div>

    <!-- Standard (equirectangular) projection -- src/routes/api.js and
         src/udp/index.js attach lat/lon to each QSO (exchange grid, else a
         HamQTH grid, else the country file's estimate); see dashboard.js's
         mapPoints()/projectLatLon() for the canvas math. Every layer under
         the dots is plate carree over the whole globe, same projection, so
         they stack in the viewBox with no reprojection -- built by
         scripts/build-worldmap.py from Natural Earth + NASA Black Marble
         (both public domain). QTCs are excluded (relayed traffic re-sent
         for an existing contact, not a new one -- same reasoning as the
         MULT chip). The card is always shown (so the page layout doesn't
         jump when the first QSO lands); only the map itself waits for QSOs
         -- see the x-if around .map-box below. -->
    <section class="card card--wide" id="worldmap">
      <h2>World Map <span class="map-subtitle" x-text="mapBand === 'all' ? 'last 30 QSOs' : ('last 30 QSOs on ' + bandLabel(mapBand))"></span>
        <!-- Per-viewer show/hide, remembered in localStorage (see
             toggleWorldMap()). Collapses to just this header rather than
             removing the card, so the way back is always right here. -->
        <button type="button" class="card-toggle" @click="toggleWorldMap()"
                :aria-expanded="showWorldMap" aria-controls="worldmap-body"
                x-text="showWorldMap ? 'Hide' : 'Show'"></button>
      </h2>
      <!-- x-if, not x-show: a hidden map shouldn't keep recomputing the
           terminator every second or hold its images in the layout. -->
      <template x-if="showWorldMap">
      <div id="worldmap-body">
      <!-- Band filter: All, or one band. Only offered once the log has more
           than one band (with one, All already is that band). -->
      <div class="map-bands" role="group" aria-label="Show QSOs on band" x-show="mapBands().length > 1">
        <button type="button" class="map-band" :aria-pressed="mapBand === 'all'" @click="mapBand = 'all'">All</button>
        <template x-for="b in mapBands()" :key="b">
          <button type="button" class="map-band" :aria-pressed="mapBand === b" @click="mapBand = b" x-text="bandLabel(b)"></button>
        </template>
      </div>
      <!-- x-if, not x-show: with no QSOs there's nothing to plot, so the
           map (and its every-second terminator recompute) isn't rendered at
           all -- the empty-state line below takes its place. -->
      <template x-if="qsos.length > 0">
      <div class="map-box">
        <svg viewBox="0 0 1000 500" class="worldmap-svg" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- Soft terminator edge: the night mask's shape is blurred, so
                 dusk fades in over a few degrees instead of a hard line.
                 nightPolygonPath() pads its shape past the viewBox edges so
                 the blur doesn't also fade the night side at the map's own
                 left/right/pole edges. -->
            <filter id="worldmap-soft" x="-10%" y="-10%" width="120%" height="120%">
              <feGaussianBlur stdDeviation="6"></feGaussianBlur>
            </filter>
            <mask id="worldmap-night-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
              <path :d="nightPolygonPath()" fill="#fff" filter="url(#worldmap-soft)"></path>
            </mask>
          </defs>
          <!-- Ocean: per-theme image (dark navy / lighter blues), picked once
               in init() -- the theme toggle reloads the page, and binding
               the href means only one of the two is ever downloaded. -->
          <image :href="mapOceanHref" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
          <image href="/img/map/land.webp" class="worldmap-land" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
          <image href="/img/map/borders.svg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
          <!-- Grayline: a tint plus city lights, both only where the mask
               says it's night. Over the land so night reads as night, under
               the zones/dots/home marker so contact data stays legible. -->
          <g mask="url(#worldmap-night-mask)" class="worldmap-nightside">
            <rect class="worldmap-night" x="0" y="0" width="1000" height="500"></rect>
            <image href="/img/map/lights.webp" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
          </g>
          <!-- Time zone bands + UTC offset badges along the top (static,
               see mapZonesSvg()). -->
          <g x-html="mapZonesSvg()"></g>
          <!-- Dots are injected as a raw SVG string via x-html, not a
               <template x-for> -- confirmed live in a real browser that
               Alpine's x-for/template breaks when nested inside <svg> (only
               the first item ever bound). See mapDotsSvg()'s own comment
               in dashboard.js. -->
          <g x-html="mapDotsSvg()"></g>
          <!-- Home: N1MM's reported transmitter grid (score.grid6), not a
               fixed location -- see homePoint()'s own comment. A single
               marker, so (like the land/night paths) this binds directly,
               no x-for involved. -->
          <circle x-show="homePoint()" :cx="homePoint() ? homePoint().x : 0"
                  :cy="homePoint() ? homePoint().y : 0" r="7" class="worldmap-home">
            <!-- Nested <title>, not a `title` attribute -- see
                 mapDotsSvg()'s comment in dashboard.js: the attribute alone
                 doesn't trigger a real hover tooltip. -->
            <title x-text="homePoint() ? ('Home — ' + homePoint().grid) : ''"></title>
          </circle>
        </svg>
      </div>
      </template>
      <p x-show="qsos.length === 0 || mapPoints().length === 0" class="empty"
         x-text="qsos.length === 0 ? 'No QSOs logged yet -- the map appears with the first contact.' : (mapBand === 'all' ? 'No located QSOs yet' : ('No located QSOs on ' + bandLabel(mapBand)))"></p>
      </div>
      </template>
    </section>

    <section class="card card--wide" id="operators" x-show="qsos.length > 0">
      <h2>Operators</h2>
      <table class="qso-table">
        <thead>
          <tr>
            <th>Operator</th><th>QSOs</th><th>Points</th><th>Peak Rate (60m)</th><th>Peak Rate (10m)</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="op in operatorStats()" :key="op.operator">
            <tr>
              <td x-text="op.operator"></td>
              <td x-text="op.qsos"></td>
              <td x-text="op.points"></td>
              <td x-text="op.peakRate60 + '/hr'"></td>
              <td x-text="op.peakRate10 + '/hr'"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>

    <section class="card card--wide" id="log">
      <h2>Recent QSOs</h2>
      <div class="log-layout">
        <div class="log-table-wrap">
          <table class="qso-table">
            <thead>
              <tr>
                <th>Call</th><th>Band</th><th>Mode</th><th>Operator</th><th>Pts</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="q in qsos.slice(0, 20)" :key="q.ext_id ?? q.id ?? (q.call + q.band + q.mode)">
                <tr :class="isXQso(q) && 'qso-row--x'">
                  <td>
                    <span x-text="q.call"></span>
                    <span class="chip chip--x" x-show="isXQso(q)" title="X-QSO -- marked invalid in the logger; not counted anywhere">X-QSO</span>
                    <span class="chip chip--qtc" x-show="isQtc(q)" title="QTC -- relayed traffic, not a new contact">QTC</span>
                    <span class="chip chip--mult" x-show="isMult(q)" title="New multiplier (per N1MM)">MULT</span>
                  </td>
                  <td x-text="q.band"></td>
                  <td x-text="q.mode"></td>
                  <td x-text="q.operator"></td>
                  <td x-text="q.points"></td>
                </tr>
              </template>
            </tbody>
          </table>
          <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
        </div>

        <div class="continent-panel" x-show="qsos.length > 0">
          <h3>By Continent</h3>
          <!-- Same sequential blue-alpha scheme as before (see dashboard.js's
               continentCounts()/continentTileStyle()), just as plain rows
               instead of a geographic grid -- the grid's layout never read
               as an actual map, just an awkward crossword-shaped grid. -->
          <template x-for="code in ['NA','EU','AS','AF','OC','SA','AN']" :key="code">
            <div class="continent-row" :style="continentTileStyle(code)">
              <span class="continent-row__label" x-text="code"></span>
              <span class="continent-row__count" x-text="continentCounts()[code] || 0"></span>
            </div>
          </template>
        </div>
      </div>
    </section>

    <!-- Possible busts: callsigns HamQTH doesn't recognise. Only rendered
         when live lookup is enabled (features.lookup.enabled from
         /api/features) AND there's at least one -- an empty card would just
         be noise. The list is derived server-side from the current log, so
         a call fixed in the logger drops off within a minute. Placed last --
         a low-frequency "you might want to double-check this" aside, not
         something that should push the live score/log down the page. -->
    <section class="card card--wide" id="busts"
             x-show="features.lookup && features.lookup.enabled && busts.length > 0">
      <h2 x-text="'Possible Busts (' + busts.length + ')'"></h2>
      <table class="qso-table">
        <thead>
          <tr><th>Call</th><th>Band</th><th>Mode</th><th>Operator</th><th>Logged</th></tr>
        </thead>
        <tbody>
          <template x-for="b in busts" :key="b.call + b.band + b.mode">
            <tr>
              <td class="bust-call" x-text="b.call"></td>
              <td x-text="b.band"></td>
              <td x-text="b.mode"></td>
              <td x-text="b.operator || '—'"></td>
              <td x-text="bustTime(b.logged_at)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </section>

  </main>

  <footer class="footer">
    <span x-show="version.deployedAt" x-text="'deployed ' + formatDeployTime(version.deployedAt) + (version.commit ? ' (' + version.commit + ')' : '') + (tenantLabel() ? ' · ' + tenantLabel() : '')"></span>
  </footer>

  <!-- Not type="module": dashboard() must land on the global scope for
       Alpine's x-data="dashboard()" (evaluated in global scope) to find it.
       A module's top-level declarations are scoped to the module itself,
       not exposed on window -- with type="module" here, Alpine's root
       x-data throws "dashboard is not defined" and the whole component
       silently fails to initialize, which is consistent with every
       "field renders as undefined" symptom seen on this dashboard so far. -->
  <script src="/js/chrome.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
