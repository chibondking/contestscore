<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContestPulse</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body x-data="dashboard()" x-init="init()">

  <header class="header">
    <h1>ContestPulse</h1>
    <span class="updated" x-text="'updated ' + secondsSinceUpdate() + 's ago'"></span>
    <span class="status" :class="connected ? 'status--ok' : 'status--err'">
      <span x-text="connected ? 'live' : 'disconnected'"></span>
    </span>
  </header>

  <main class="grid">

    <section class="card" id="score">
      <h2>Score</h2>
      <div class="score-row">
        <div class="metric">
          <span class="metric__value" x-text="score.qsos ?? '—'"></span>
          <span class="metric__label">QSOs</span>
        </div>
        <div class="metric">
          <span class="metric__value" x-text="score.mults ?? '—'"></span>
          <span class="metric__label">Mults</span>
        </div>
        <div class="metric">
          <span class="metric__value" x-text="score.total ?? '—'"></span>
          <span class="metric__label">Total</span>
        </div>
      </div>
    </section>

    <section class="card" id="rate">
      <h2>Rate</h2>
      <div class="score-row" x-show="rate.length > 0">
        <template x-for="r in rate" :key="r.minutes">
          <div class="metric">
            <span class="metric__value" x-text="r.rate_per_hour ?? '—'"></span>
            <span class="metric__label" x-text="(r.minutes ?? '?') + ' min'"></span>
          </div>
        </template>
      </div>
      <p x-show="rate.length === 0" class="empty">Loading…</p>
    </section>

    <section class="card" id="bridges" x-show="bridges.length > 0">
      <h2>Feed Status</h2>
      <template x-for="b in bridges" :key="b.station_id">
        <div class="bridge-row">
          <span class="bridge-station" x-text="b.station_id"></span>
          <span class="bridge-badge" :class="'bridge-badge--' + b.status" x-text="b.status"></span>
        </div>
      </template>
    </section>

    <section class="card" id="radios">
      <h2>Radios</h2>
      <template x-for="r in radios" :key="r.radio_nr">
        <div class="radio-row">
          <span class="radio-nr" x-text="r.radio_nr != null ? 'R' + r.radio_nr : '—'"></span>
          <span class="radio-freq" x-text="r.freq ? (r.freq / 1000).toFixed(1) + ' kHz' : '—'"></span>
          <span class="radio-mode" x-text="r.mode || '—'"></span>
          <span class="radio-op" x-text="r.op_call || '—'"></span>
          <span class="radio-run" x-show="r.is_running">RUN</span>
        </div>
      </template>
      <p x-show="radios.length === 0" class="empty">No radio data yet</p>
    </section>

    <section class="card card--wide" id="log">
      <h2>Recent QSOs</h2>
      <table class="qso-table">
        <thead>
          <tr>
            <th>Call</th><th>Band</th><th>Mode</th><th>Operator</th><th>Pts</th>
          </tr>
        </thead>
        <tbody>
          <template x-for="q in qsos.slice(0, 50)" :key="q.id ?? q.call + q.band">
            <tr>
              <td x-text="q.call"></td>
              <td x-text="q.band"></td>
              <td x-text="q.mode"></td>
              <td x-text="q.operator"></td>
              <td x-text="q.points"></td>
            </tr>
          </template>
        </tbody>
      </table>
      <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
    </section>

  </main>

  <footer class="footer" x-show="version.deployedAt">
    <span x-text="'deployed ' + formatDeployTime(version.deployedAt) + (version.commit ? ' (' + version.commit + ')' : '')"></span>
  </footer>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
