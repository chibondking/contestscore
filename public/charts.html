<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Applied before first paint so a viewer who chose light never sees a
       dark flash -- dark is the default (no localStorage entry) and needs
       no attribute at all. See chrome.js for the toggle that sets/persists
       this key. -->
  <script>
    try {
      if (localStorage.getItem('contestpulse_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch {}
  </script>
  <title>ContestPulse Charts</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <!-- Plain (non-deferred): Chart/io must exist as globals before Alpine's
       deferred script initializes and starts evaluating x-effect
       expressions that call into them -- same reasoning as index.html. -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="charts()" x-init="init()">

  <header class="header" data-page="charts">
    <!-- A 48-hour contest generates a lot of per-operator detail; default to
         the at-a-glance set below and let a viewer who wants the full
         per-operator time series opt into it, rather than showing both
         all the time. -->
    <label class="detail-toggle">
      <input type="checkbox" x-model="detailed" @change="saveDetailed()">
      Detailed view
    </label>
  </header>

  <main class="grid">

    <template x-if="logMeta">
      <section class="card card--wide analyze-banner">
        <span x-text="'Analyzing: ' + (logMeta.contest || logMeta.filename || 'uploaded log') + ' · ' + (logMeta.station_call || '?') + ' · ' + logMeta.qso_count + ' QSOs · ' + logMeta.format.toUpperCase()"></span>
        <a href="/analyze">&larr; new analysis</a>
      </section>
    </template>

    <section class="card card--wide" id="rate-chart">
      <h2>QSO Rate Over Time</h2>
      <div class="chart-box chart-box--trend">
        <canvas id="rateChart" x-effect="renderRateChart()"></canvas>
      </div>
      <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
    </section>

    <section class="card card--wide" id="score-chart">
      <h2>Score Over Time</h2>
      <div class="chart-box chart-box--trend">
        <canvas id="scoreChart" x-effect="renderScoreChart()"></canvas>
      </div>
      <p x-show="scoreHistory.length === 0" class="empty">No score data yet</p>
    </section>

    <section class="card card--wide" id="operator-qso-chart">
      <h2>QSOs by Operator</h2>
      <div class="chart-box chart-box--trend">
        <canvas id="operatorQsoChart" x-effect="renderOperatorQsoChart()"></canvas>
      </div>
      <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
    </section>

    <!-- Per-operator breakdowns. An uploaded log that carried no per-QSO
         operator field can't be split this way at all; one that carried no
         points / mults drops just that chart (same gating as the "more
         charts" grid via logMeta.has_*). The live feed always has all three. -->
    <template x-if="detailed && (!logMeta || logMeta.has_operator)">
      <div class="grid" style="padding: 0; grid-column: 1 / -1;">

        <section class="card card--wide" id="operator-rate-chart">
          <h2>Rate by Operator (QSOs per hour)</h2>
          <div class="chart-box chart-box--trend">
            <canvas id="operatorRateChart" x-effect="renderOperatorRateChart()"></canvas>
          </div>
          <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
        </section>

        <template x-if="!logMeta || logMeta.has_points">
          <section class="card card--wide" id="operator-score-chart">
            <h2>Score Contribution by Operator</h2>
            <div class="chart-box chart-box--trend">
              <canvas id="operatorScoreChart" x-effect="renderOperatorScoreChart()"></canvas>
            </div>
            <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
          </section>
        </template>

        <template x-if="!logMeta || logMeta.has_mults">
          <section class="card card--wide" id="operator-mult-chart">
            <h2>Multiplier Contribution by Operator</h2>
            <div class="chart-box chart-box--trend">
              <canvas id="operatorMultChart" x-effect="renderOperatorMultChart()"></canvas>
            </div>
            <p x-show="qsos.length === 0" class="empty">No QSOs logged yet</p>
          </section>
        </template>

      </div>
    </template>

    <!-- "More charts": a spec-driven grid of extra breakdowns (see
         charts.js EXTRA_CHART_SPECS / renderExtra). Always shown once
         there's data -- the Detailed toggle above only gates the
         per-operator time series, which are the heavy, opt-in view. -->
    <template x-if="qsos.length > 0">
      <div class="grid grid--nested">
        <template x-for="spec in extraCharts" :key="spec.id">
          <section class="card" :class="spec.wide ? 'card--wide' : ''">
            <h2 x-text="spec.title"></h2>
            <div class="chart-box" :class="spec.pie ? 'chart-box--pie' : 'chart-box--trend'">
              <canvas :id="spec.id" x-effect="renderExtra(spec)"></canvas>
            </div>
          </section>
        </template>
      </div>
    </template>

  </main>

  <footer class="footer"></footer>

  <script src="/js/chrome.js"></script>
  <script src="/js/charts.js"></script>
</body>
</html>
