<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Applied before first paint so a viewer who chose light never sees a
       dark flash -- dark is the default (no localStorage entry) and needs
       no attribute at all. See chrome.js for the toggle that sets/persists
       this key. -->
  <script>
    try {
      if (localStorage.getItem('contestpulse_theme') === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    } catch {}
  </script>
  <title>ContestPulse Compare</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <!-- Plain (non-deferred), same reasoning as charts.html: Chart must exist
       as a global before Alpine's deferred script starts evaluating the
       x-effect expressions below that call into it. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="compare()" x-init="init()">

  <header class="header" data-page="analyze"></header>

  <main class="grid">

    <template x-if="loading">
      <section class="card card--wide"><p class="empty">Loading…</p></section>
    </template>

    <template x-if="!loading && error">
      <section class="card card--wide">
        <h2>Can't compare</h2>
        <p class="empty" x-text="error"></p>
        <p class="empty"><a href="/analyze">Back to Analyze</a></p>
      </section>
    </template>

    <template x-if="ready">
      <section class="card card--wide">
        <h2>Comparison</h2>
        <div class="tile-row" style="gap:2rem 3rem">
          <div>
            <div class="metric__label">A</div>
            <div x-text="(a.meta.contest || a.meta.filename || aId) + ' · ' + (a.meta.station_call || '?')"></div>
            <a class="chip" style="margin-top:.3rem;display:inline-block" :href="'/stats.html?log=' + aId">open A</a>
          </div>
          <div>
            <div class="metric__label">B</div>
            <div x-text="(b.meta.contest || b.meta.filename || bId) + ' · ' + (b.meta.station_call || '?')"></div>
            <a class="chip" style="margin-top:.3rem;display:inline-block" :href="'/stats.html?log=' + bId">open B</a>
          </div>
        </div>
      </section>
    </template>

    <template x-if="ready">
      <section class="card card--wide">
        <h2>Headline</h2>
        <div class="table-scroll">
          <table class="qso-table stats-table">
            <thead><tr><th>Metric</th><th class="num">A</th><th class="num">B</th><th class="num">Δ (B−A)</th></tr></thead>
            <tbody>
              <template x-for="r in metricRows" :key="r.label">
                <tr>
                  <td x-text="r.label"></td>
                  <td class="num" x-text="r.a"></td>
                  <td class="num" x-text="r.b"></td>
                  <td class="num" :style="r.up ? 'color:var(--green)' : (r.down ? 'color:var(--red)' : '')" x-text="r.delta"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </template>

    <template x-if="ready">
      <section class="card card--wide">
        <h2>QSOs by band</h2>
        <div class="table-scroll">
          <table class="qso-table stats-table">
            <thead><tr><th>Band</th><th class="num">A</th><th class="num">B</th><th class="num">Δ</th></tr></thead>
            <tbody>
              <template x-for="r in bandRows" :key="r.band">
                <tr>
                  <td x-text="r.band"></td>
                  <td class="num" x-text="r.a.toLocaleString()"></td>
                  <td class="num" x-text="r.b.toLocaleString()"></td>
                  <td class="num" :style="r.up ? 'color:var(--green)' : (r.down ? 'color:var(--red)' : '')" x-text="r.delta"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </section>
    </template>

    <template x-if="ready">
      <section class="card card--wide">
        <h2>QSO Rate Over Time</h2>
        <p class="empty" style="margin-bottom:.5rem">
          Aligned to each log's own first QSO — A and B rarely share a
          calendar date, so elapsed time is what actually overlays them.
        </p>
        <div class="chart-box chart-box--trend">
          <canvas id="cmpRateChart" x-effect="renderRateChart()"></canvas>
        </div>
      </section>
    </template>

    <template x-if="ready">
      <section class="card card--wide">
        <h2>Cumulative QSOs</h2>
        <div class="chart-box chart-box--trend">
          <canvas id="cmpCumChart" x-effect="renderCumulativeChart()"></canvas>
        </div>
      </section>
    </template>

    <template x-if="ready">
      <div class="grid grid--nested">
        <section class="card">
          <h2>QSOs by Band</h2>
          <div class="chart-box chart-box--trend">
            <canvas id="cmpBandChart" x-effect="renderBandChart()"></canvas>
          </div>
        </section>

        <section class="card">
          <h2>QSOs by Mode</h2>
          <div class="chart-box chart-box--trend">
            <canvas id="cmpModeChart" x-effect="renderModeChart()"></canvas>
          </div>
        </section>

        <section class="card">
          <h2>QSOs by Continent</h2>
          <div class="chart-box chart-box--trend">
            <canvas id="cmpContChart" x-effect="renderContinentChart()"></canvas>
          </div>
        </section>

        <template x-if="hasRunFlag">
          <section class="card">
            <h2>Run vs. Search &amp; Pounce</h2>
            <div class="chart-box chart-box--trend">
              <canvas id="cmpRunSpChart" x-effect="renderRunSpChart()"></canvas>
            </div>
          </section>
        </template>
      </div>
    </template>

    <template x-if="solarReady">
      <div class="grid grid--nested">
        <section class="card card--wide">
          <h2 style="margin-bottom:.25rem">Space Weather During Each Session</h2>
          <p class="empty" style="margin-bottom:1rem">
            SFI / K-index readings captured while this station was live —
            only available for a "snapshot the live contest" analysis, since
            an uploaded log from an arbitrary past date has no captured
            solar data.
          </p>
        </section>

        <template x-if="a.meta.format === 'live'">
          <section class="card">
            <h2>A — Conditions</h2>
            <div x-show="solarA.length" x-effect="renderSolarChart('a')">
              <h3 class="chart-subhead">Solar flux (SFI)</h3>
              <div class="chart-box chart-box--solar"><canvas id="cmpSolarASfi"></canvas></div>
              <h3 class="chart-subhead">K-index <span class="chart-subhead__note">0–9, higher = more disturbed</span></h3>
              <div class="chart-box chart-box--solar"><canvas id="cmpSolarAK"></canvas></div>
            </div>
            <p class="empty" x-show="!solarA.length">No solar readings captured during this session.</p>
          </section>
        </template>

        <template x-if="b.meta.format === 'live'">
          <section class="card">
            <h2>B — Conditions</h2>
            <div x-show="solarB.length" x-effect="renderSolarChart('b')">
              <h3 class="chart-subhead">Solar flux (SFI)</h3>
              <div class="chart-box chart-box--solar"><canvas id="cmpSolarBSfi"></canvas></div>
              <h3 class="chart-subhead">K-index <span class="chart-subhead__note">0–9, higher = more disturbed</span></h3>
              <div class="chart-box chart-box--solar"><canvas id="cmpSolarBK"></canvas></div>
            </div>
            <p class="empty" x-show="!solarB.length">No solar readings captured during this session.</p>
          </section>
        </template>
      </div>
    </template>

  </main>

  <footer class="footer"></footer>

  <script src="/js/chrome.js"></script>
  <script src="/js/compare.js"></script>
</body>
</html>
