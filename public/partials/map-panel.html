<!-- The map card (public/js/map-panel.js), shared by the dashboard
     (index.html) and Map TV (map.html). The server fills it into each page
     at the page's "#include map-panel" comment (src/pages.js), so this is
     the only copy: edit it here. -->
<!-- Standard (equirectangular) projection -- src/routes/api.js and
     src/udp/index.js attach lat/lon to each QSO (exchange grid, else a
     HamQTH grid, else the country file's estimate); see map-panel.js's
     mapPoints()/projectLatLon() for the canvas math. Every layer under
     the dots is plate carree over the whole globe, same projection, so
     they stack in the viewBox with no reprojection -- built by
     scripts/build-worldmap.py from Natural Earth + NASA Black Marble
     (both public domain). QTCs are excluded (relayed traffic re-sent
     for an existing contact, not a new one -- same reasoning as the
     MULT chip). The card is always shown (so the page layout doesn't
     jump when the first QSO lands); only the map itself waits for QSOs
     -- see the x-if around .map-box below. -->
<section class="card card--wide" id="worldmap">
  <!-- World | US/VE | ARRL (mapView()): the world map, or the US/VE
       atlas with states / provinces or with the ARRL/RAC sections.
       ARRL Sweepstakes and Field Day (map-panel.js SECTION_CONTEST_RE)
       open on ARRL with worked sections filled in, anything else on
       World. Same card, same Show/Hide, same 2:1 shape. -->
  <h2><span x-text="mapTitle()"></span> <span class="map-subtitle" x-text="mapSubtitle()"></span>
    <template x-if="showWorldMap">
      <span class="map-views" role="group" aria-label="Map view">
        <button type="button" class="map-band" :aria-pressed="mapView() === 'world'" @click="setMapView('world')">World</button>
        <button type="button" class="map-band" :aria-pressed="mapView() === 'na'" @click="setMapView('na')">US/VE</button>
        <button type="button" class="map-band" :aria-pressed="mapView() === 'arrl'" @click="setMapView('arrl')">ARRL</button>
      </span>
    </template>
    <!-- x-if, not x-show: a hidden button would still be the sibling
         that `.card-toggle + .card-toggle` keys off. -->
    <template x-if="showWorldMap">
      <button type="button" class="card-toggle" @click="exportMap()" x-show="!tvMode"
              :disabled="mapExporting" title="Download the map as a PNG image"
              x-text="mapExporting ? 'Saving…' : (mapExportFailed ? 'Save failed' : 'Save PNG')"></button>
    </template>
    <!-- Per-viewer show/hide, remembered in localStorage (see
         toggleWorldMap()). Collapses to just this header rather than
         removing the card, so the way back is always right here. -->
    <button type="button" class="card-toggle" @click="toggleWorldMap()" x-show="!tvMode"
            :aria-expanded="showWorldMap" :aria-controls="mapView() === 'world' ? 'worldmap-body' : 'secmap-body'"
            x-text="showWorldMap ? 'Hide' : 'Show'"></button>
  </h2>
  <!-- x-if, not x-show: a hidden map shouldn't keep recomputing the
       terminator every second or hold its images in the layout. -->
  <!-- The US/VE atlas, for US/VE and ARRL (atlasMode()). -->
  <!-- Band filter: All, or one band. Only offered once the log has more
       than one band (with one, All already is that band). Dots only, so
       not for an ARRL contest's section map. -->
  <div class="map-bands" role="group" aria-label="Show QSOs on band" x-show="showWorldMap && atlasMode() !== 'sections' && qsos.length > 0 && mapBands().length > 1">
    <button type="button" class="map-band" :aria-pressed="mapBand === 'all'" @click="mapBand = 'all'">All</button>
    <template x-for="b in mapBands()" :key="b">
      <button type="button" class="map-band" :aria-pressed="mapBand === b" @click="mapBand = b" x-text="bandLabel(b)"></button>
    </template>
  </div>
  <!-- Map HUD (mapHud()): once Score/Rate/Radios have scrolled up out
       of sight, the map carries the newest QSO and the score so a
       viewer can sit on the map. Overlaid on the map's top-left corner
       (.map-stage is the positioning box for both maps); not part of
       Save PNG, which draws only the SVG. -->
  <div class="map-stage">
  <div class="map-hud" x-show="showWorldMap && mapHud()" x-cloak aria-live="polite">
    <template x-for="q in (lastWorked() ? [lastWorked()] : [])" :key="q.ext_id ?? q.id ?? (q.call + q.band + q.mode)">
      <div class="map-hud__last">
        <span class="map-hud__label">Last worked</span>
        <span class="map-hud__call" x-text="q.call"></span>
        <span class="chip chip--mult" x-show="isMult(q)" title="New multiplier (per N1MM)">MULT</span>
        <span class="chip chip--qtc" x-show="isQtc(q)" title="QTC -- relayed traffic, not a new contact">QTC</span>
        <span class="map-hud__meta" x-text="[bandLabel(q.band), q.mode].filter(Boolean).join(' ')"></span>
      </div>
    </template>
    <div class="map-hud__score" x-show="score.total != null || hudRate()">
      <span><b x-text="score.qsos ?? '—'"></b> QSOs</span>
      <span><b x-text="score.mults ?? '—'"></b> mults</span>
      <span><b x-text="score.total ?? '—'"></b> pts</span>
      <span x-show="dxccCount() != null"><b x-text="dxccCount()"></b> DXCC</span>
      <span x-show="hudRate()"><b x-text="hudRate() ? hudRate().value : ''"></b>/hr <small x-text="hudRate() ? '(' + hudRate().label + ')' : ''"></small></span>
    </div>
    <!-- COSB rank, when this board has the standings switched on and
         COSB lists the station (hudCosb()). -->
    <div class="map-hud__cosb" x-show="hudCosb()" :title="cosbTitle()">
      <b x-text="hudCosb() ? hudCosb().call : ''"></b>
      <b x-text="hudCosb() ? '#' + hudCosb().rank : ''"></b>
      <span x-text="hudCosb() ? 'of ' + hudCosb().count : ''"></span>
      <small x-text="hudCosb() ? hudCosb().section + ' · COSB' : ''"></small>
    </div>
  </div>
  <template x-if="showWorldMap && mapView() !== 'world'">
  <div id="secmap-body" x-init="loadSectionMap()">
    <div class="map-box secmap-box" x-show="sectionMapData">
      <!-- Same layering as the world map: ocean + relief, then the
           grayline (tint + city lights through a blurred night mask),
           then the sections, labels and home ring on top. The imagery
           is the world map's own, reprojected in the browser
           (buildSectionImagery()); until it's ready the vector land
           shows instead. -->
      <!-- Static viewBox, never an Alpine-bound one -- the HTML parser lowercases
           the bound attribute to "viewbox", which SVG ignores, leaving
           the default 300x150 box (seen live: map cropped to a 150px
           strip). Must match sections.json's width/height; a test in
           test/dashboard checks it. -->
      <svg viewBox="0 0 1000 500"
           class="worldmap-svg" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="secmap-soft" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="6"></feGaussianBlur>
          </filter>
          <mask id="secmap-night-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="2000">
            <g x-html="sectionNightMaskSvg()"></g>
          </mask>
        </defs>
        <image x-show="sectionImagery.base" :href="sectionImagery.base" x="0" y="0"
               :width="sectionMapData ? sectionMapData.width : 0" :height="sectionMapData ? sectionMapData.height : 0"
               preserveAspectRatio="none"></image>
        <g mask="url(#secmap-night-mask)" class="worldmap-nightside">
          <rect class="worldmap-night" x="0" y="0" width="1000" height="2000"></rect>
          <image x-show="sectionImagery.lights" :href="sectionImagery.lights" x="0" y="0"
                 :width="sectionMapData ? sectionMapData.width : 0" :height="sectionMapData ? sectionMapData.height : 0"
                 preserveAspectRatio="none"></image>
        </g>
        <!-- x-html on a <g>, like the world map's dots -- see
             sectionMapSvg() in map-panel.js. -->
        <g x-html="sectionMapSvg()"></g>
        <g x-html="sectionDotsSvg()"></g>
        <g x-html="sectionHomeSvg()"></g>
      </svg>
    </div>
    <p class="secmap-needed" x-show="atlasMode() === 'sections' && sectionMapData && sectionTally().needed.length">
      <span class="secmap-needed-label" x-text="'Needed (' + sectionTally().needed.length + ')'"></span>
      <span x-text="sectionTally().needed.join(' ')"></span>
    </p>
    <p class="secmap-needed secmap-sweep" x-show="atlasMode() === 'sections' && sectionMapData && sectionTally().total && !sectionTally().needed.length">Clean sweep -- every section worked</p>
    <p class="empty" x-show="!sectionMapData">Loading section map…</p>
  </div>
  </template>
  <template x-if="showWorldMap && mapView() === 'world'">
  <div id="worldmap-body">
  <!-- x-if, not x-show: with no QSOs there's nothing to plot, so the
       map (and its every-second terminator recompute) isn't rendered at
       all -- the empty-state line below takes its place. -->
  <template x-if="qsos.length > 0">
  <div class="map-box">
    <svg viewBox="0 0 1000 500" class="worldmap-svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Soft terminator edge: the night mask's shape is blurred, so
             dusk fades in over a few degrees instead of a hard line.
             nightPolygonPath() pads its shape past the viewBox edges so
             the blur doesn't also fade the night side at the map's own
             left/right/pole edges. -->
        <filter id="worldmap-soft" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="6"></feGaussianBlur>
        </filter>
        <mask id="worldmap-night-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
          <path :d="nightPolygonPath()" fill="#fff" filter="url(#worldmap-soft)"></path>
        </mask>
        <!-- Lakes: land.webp's source (ne_50m_land) counts lakes as land,
             so the Great Lakes etc. are cut out of it here and the ocean
             shows through, same as the section map's lake cut.
             lakes.svg is black lakes on transparent; see
             scripts/build-worldmap.py. -->
        <mask id="worldmap-lakes-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="500">
          <rect x="0" y="0" width="1000" height="500" fill="#fff"></rect>
          <image href="/img/map/lakes.svg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
        </mask>
      </defs>
      <!-- Ocean: per-theme image (dark navy / lighter blues), picked once
           in init() -- the theme toggle reloads the page, and binding
           the href means only one of the two is ever downloaded. -->
      <image :href="mapOceanHref" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
      <image href="/img/map/land.webp" class="worldmap-land" mask="url(#worldmap-lakes-mask)" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
      <image href="/img/map/borders.svg" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
      <!-- Grayline: a tint plus city lights, both only where the mask
           says it's night. Over the land so night reads as night, under
           the zones/dots/home marker so contact data stays legible. -->
      <g mask="url(#worldmap-night-mask)" class="worldmap-nightside">
        <rect class="worldmap-night" x="0" y="0" width="1000" height="500"></rect>
        <image href="/img/map/lights.webp" x="0" y="0" width="1000" height="500" preserveAspectRatio="none"></image>
      </g>
      <!-- Time zone bands + UTC offset badges along the top (static,
           see mapZonesSvg()). -->
      <g x-html="mapZonesSvg()"></g>
      <!-- Dots are injected as a raw SVG string via x-html, not a
           <template x-for> -- confirmed live in a real browser that
           Alpine's x-for/template breaks when nested inside <svg> (only
           the first item ever bound). See mapDotsSvg()'s own comment
           in map-panel.js. -->
      <g x-html="mapDotsSvg()"></g>
      <!-- Home: N1MM's reported transmitter grid (score.grid6), not a
           fixed location -- see homePoint()'s own comment. A single
           marker, so (like the land/night paths) this binds directly,
           no x-for involved. -->
      <circle x-show="homePoint()" :cx="homePoint() ? homePoint().x : 0"
              :cy="homePoint() ? homePoint().y : 0" r="7" class="worldmap-home">
        <!-- Nested <title>, not a `title` attribute -- see
             mapDotsSvg()'s comment in map-panel.js: the attribute alone
             doesn't trigger a real hover tooltip. -->
        <title x-text="homePoint() ? ('Transmitter location — ' + homePoint().grid) : ''"></title>
      </circle>
    </svg>
  </div>
  </template>
  <p x-show="qsos.length === 0 || mapPoints().length === 0" class="empty"
     x-text="qsos.length === 0 ? 'No QSOs logged yet -- the map appears with the first contact.' : (mapBand === 'all' ? 'No located QSOs yet' : ('No located QSOs on ' + bandLabel(mapBand)))"></p>
  </div>
  </template>
  </div><!-- .map-stage -->
</section>
