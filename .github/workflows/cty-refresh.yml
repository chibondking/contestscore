name: refresh cty.csv

# The log analyzer resolves each worked call's continent / DXCC / CQ zone
# from src/analyze/cty.csv (the "big CTY" country file from
# country-files.com). That file changes roughly monthly as entities and
# prefixes are added; this keeps the bundled copy current by opening a PR
# whenever it has actually changed.

on:
  schedule:
    - cron: '17 6 3 * *'   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the current big CTY
        run: |
          curl -sSL --fail --max-time 60 \
            https://www.country-files.com/bigcty/cty.csv \
            -o src/analyze/cty.csv
          # Sanity: a real file is a few hundred KB with a header row for K.
          test "$(wc -c < src/analyze/cty.csv)" -gt 100000
          grep -q '^K,United States,' src/analyze/cty.csv

      - name: Open a PR if it changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'Refresh src/analyze/cty.csv from country-files.com'
          title: 'Refresh cty.csv (country file)'
          body: |
            Automated monthly refresh of the bundled country file used by the
            log analyzer's continent / DXCC / CQ-zone resolver.
          branch: chore/cty-refresh
          delete-branch: true
          add-paths: src/analyze/cty.csv
